- name: Build frontend
  run: |
    cd frontend
    npm install
    npm run build

- name: Copy frontend build to EC2
  uses: appleboy/scp-action@v0.1.7
  with:
    host: ${{ secrets.HOST }}
    username: ${{ secrets.USERNAME }}
    key: ${{ secrets.SSH_PRIVATE_KEY }}
    source: "frontend/dist/*"
    target: "/home/ubuntu/bukabuku/docker/app/wp-content/themes/mytheme/dist/"
    overwrite: true