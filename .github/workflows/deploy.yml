name: Deploy to EC2

on: 
  push:
    branches:
      - main
      - v2-new-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
      
      # DEBUG (WAJIB)
      - name: Debug dist content
        run: |
          echo "=== DIST CONTENT ==="
          ls -la frontend/dist
      
      # PASTIKAN FOLDER ADA
      - name: Prepare EC2 folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/bukabuku/docker/app/wp-content/themes/mytheme/dist
            rm -rf /home/ubuntu/bukabuku/docker/app/wp-content/themes/mytheme/dist/*
      
      # COPY LANGSUNG KE DIST (NO TEMP FOLDER, NO RIBET)
      - name: Copy frontend build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/bukabuku/docker/app/wp-content/themes/mytheme/dist/"
          overwrite: true

      - name: Fix dist structure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/bukabuku/docker/app/wp-content/themes/mytheme/dist

            # kalau ada folder frontend → flatten
            if [ -d "frontend" ]; then
              find frontend -type f -exec mv {} . \;
              rm -rf frontend
            fi

            echo "=== FINAL DIST ==="
            ls -la

      # FIX PERMISSION
      - name: Fix permission
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R ubuntu:www-data /home/ubuntu/bukabuku/docker/app/wp-content/themes/mytheme/dist
            sudo chmod -R 755 /home/ubuntu/bukabuku/docker/app/wp-content/themes/mytheme/dist
      
      # OPTIONAL DEBUG
      - name: Verify on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== EC2 DIST CONTENT ==="
            ls -la /home/ubuntu/bukabuku/docker/app/wp-content/themes/mytheme/dist
      
      - name: restart docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/bukabuku/docker
            docker compose up -d --remove-orphans