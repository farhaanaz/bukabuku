name: Build Frontend

on: 
  push:
    branches:
      - main
      - v2-new-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install deps
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Debug dist content
        run: |
          echo "=== DIST CONTENT ==="
          ls -la frontend/dist

      - name: Commit dist to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add frontend/dist
          git commit -m "chore: update frontend build" || echo "No changes"
          git push origin main